[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-ai-daytona"
version = "0.0.0"
description = "Daytona sandbox capability for Pydantic AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Daytona Platforms Inc.", email = "support@daytona.io"}
]
keywords = ["pydantic-ai", "daytona", "sandbox", "capability", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Floor: `pydantic_ai.capabilities.AbstractCapability` and per-run toolsets
    # (`AbstractToolset.for_run`) are stable from this release on.
    "pydantic-ai-slim>=2.22.0",
    "daytona>=0.203.0,<0.204.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/daytona/integrations/tree/main/packages/pydantic-ai-daytona#readme"
Repository = "https://github.com/daytona/integrations"
Documentation = "https://github.com/daytona/integrations/tree/main/packages/pydantic-ai-daytona#readme"
Issues = "https://github.com/daytona/integrations/issues"

[tool.setuptools]
packages = ["pydantic_ai_daytona"]

[tool.setuptools.package-data]
pydantic_ai_daytona = ["py.typed"]

[tool.pytest.ini_options]
# Unit tests only by default; live tests live in tests/integration_tests and are
# invoked explicitly (see .github/workflows/integration.yml).
testpaths = ["tests/unit_tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
