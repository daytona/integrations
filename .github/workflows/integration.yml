# Live integration tests that run against REAL Daytona sandboxes and therefore
# need DAYTONA_API_KEY. These are intentionally kept OUT of ci.yml (per-PR CI).
#
# MERGE GATE: `integration-success` below is a required status check in the
# `protect-main` ruleset, and the workflow runs in two lanes so that check can
# always report:
#   - `pull_request` (no `paths:` filter -- a required check that never
#     reports would leave PRs stuck at "Expected") covers same-repo PRs:
#     humans, dependabot, and GITHUB_TOKEN-authored release-please PRs, which
#     fire no other PR event.
#   - `pull_request_target` covers fork PRs, which never receive secrets on
#     `pull_request`. This lane runs the workflow file from main (a fork
#     cannot alter the pipeline) and checks out the fork's head SHA as of the
#     triggering event; the `integration-tests` environment approval is the
#     gate in front of secret exposure, so REVIEW THE DIFF BEFORE APPROVING.
# The `changes` job routes which package suites run; suites wait for approval
# of the `integration-tests` environment, so a PR touching a package cannot
# merge before its live suite was approved AND passed.

name: integration

on:
  pull_request:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package(s) to run live tests for'
        type: choice
        default: all
        options:
          - all
          - adk
          - langchain
          - n8n
          - pi
          - pydantic-ai

permissions:
  contents: read

# Live runs create real sandboxes; don't cancel a run mid-flight (it could orphan
# sandboxes). Serialize per PR instead (ref as the dispatch fallback): under
# `pull_request_target`, `github.ref` is the BASE branch, which would collapse
# every fork-lane run repo-wide into a single queue.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Decides which package jobs run. No secrets/environment here, so this is safe
  # to run for fork PRs too (it only reads the diff).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      adk: ${{ steps.decide.outputs.adk }}
      langchain: ${{ steps.decide.outputs.langchain }}
      n8n: ${{ steps.decide.outputs.n8n }}
      pi: ${{ steps.decide.outputs.pi }}
      pydantic_ai: ${{ steps.decide.outputs.pydantic_ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        with:
          filters: |
            adk:
              - 'packages/adk-plugin/**'
            langchain:
              - 'packages/langchain-data-analysis/**'
            n8n:
              - 'packages/n8n-nodes-daytona/**'
            pi:
              - 'packages/pi-extension/**'
            pydantic_ai:
              - 'packages/pydantic-ai-daytona/**'
      - name: Decide which packages run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PKG: ${{ github.event.inputs.package }}
          # Fork = the PR's source branch lives in a different repo than ours.
          IS_FORK: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository }}
          CH_ADK: ${{ steps.filter.outputs.adk }}
          CH_LANGCHAIN: ${{ steps.filter.outputs.langchain }}
          CH_N8N: ${{ steps.filter.outputs.n8n }}
          CH_PI: ${{ steps.filter.outputs.pi }}
          CH_PYDANTIC_AI: ${{ steps.filter.outputs.pydantic_ai }}
        run: |
          set -euo pipefail
          # Two lanes, one lane per PR type: same-repo PRs run on `pull_request`,
          # fork PRs run on `pull_request_target` (the only event where they have
          # secrets). The other event's run leaves every suite skipped.
          decide() {
            local key="$1" changed="$2"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              if [ "$INPUT_PKG" = "all" ] || [ "$INPUT_PKG" = "$key" ]; then
                echo true
              else
                echo false
              fi
            elif [ "$EVENT" = "pull_request" ] && [ "$IS_FORK" != "true" ] && [ "$changed" = "true" ]; then
              echo true
            elif [ "$EVENT" = "pull_request_target" ] && [ "$IS_FORK" = "true" ] && [ "$changed" = "true" ]; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "adk=$(decide adk "${CH_ADK:-false}")"
            echo "langchain=$(decide langchain "${CH_LANGCHAIN:-false}")"
            echo "n8n=$(decide n8n "${CH_N8N:-false}")"
            echo "pi=$(decide pi "${CH_PI:-false}")"
            echo "pydantic_ai=$(decide pydantic-ai "${CH_PYDANTIC_AI:-false}")"
          } >> "$GITHUB_OUTPUT"

  adk:
    needs: changes
    if: needs.changes.outputs.adk == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      # In the fork lane (`pull_request_target`) the default checkout is the
      # BASE branch; test the fork's actual code by pinning its head SHA as of
      # the triggering event (later pushes produce a new run needing a fresh
      # environment approval). Same-repo lanes keep the default (merge ref).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install
        working-directory: packages/adk-plugin
        run: python -m pip install -e ".[dev]"
      - name: Integration tests (live Daytona)
        working-directory: packages/adk-plugin
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: pytest

  langchain:
    needs: changes
    if: needs.changes.outputs.langchain == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      # Fork lane checks out the PR head (see the adk job note).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      - uses: actions/setup-python@v5
        with:
          # Pinned to 3.12 for the same reason as ci.yml (obstore wheels).
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install
        working-directory: packages/langchain-data-analysis
        run: poetry install --with test,test_integration
      - name: Integration tests (live Daytona)
        working-directory: packages/langchain-data-analysis
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: poetry run pytest tests/integration_tests

  n8n:
    needs: changes
    if: needs.changes.outputs.n8n == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      # Fork lane checks out the PR head (see the adk job note).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install
        working-directory: packages/n8n-nodes-daytona
        run: npm ci
      - name: Integration tests (live Daytona)
        working-directory: packages/n8n-nodes-daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          # Optional (add as env secrets/vars if your account needs them):
          # DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
          # DAYTONA_ORGANIZATION_ID: ${{ secrets.DAYTONA_ORGANIZATION_ID }}
          # Optional: widen coverage to ephemeral / create-matrix suites.
          # DAYTONA_TEST_INCLUDE_EPHEMERAL: '1'
          # DAYTONA_TEST_INCLUDE_CREATE_MATRIX: '1'
        run: npm test

  pi:
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      # Fork lane checks out the PR head (see the adk job note).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install
        working-directory: packages/pi-extension
        run: npm ci
      - name: Live tests (real Daytona)
        working-directory: packages/pi-extension
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: npm run test:live

  pydantic-ai:
    needs: changes
    if: needs.changes.outputs.pydantic_ai == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      # Fork lane checks out the PR head (see the adk job note).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
      - uses: actions/setup-python@v5
        with:
          # Pinned to 3.12 for the same reason as ci.yml (obstore wheels).
          python-version: "3.12"
      - name: Install
        working-directory: packages/pydantic-ai-daytona
        run: python -m pip install -e ".[dev]"
      - name: Integration tests (live Daytona)
        working-directory: packages/pydantic-ai-daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: pytest tests/integration_tests

  # Single, stable status check to require in branch protection -- the
  # integration counterpart of ci.yml's ci-success. Suites skipped because a PR
  # does not touch their package pass through; a failed, cancelled, or
  # rejected-deployment suite blocks the merge. The job only runs in the lane
  # that owns the PR (same-repo PRs on `pull_request`, fork PRs on
  # `pull_request_target`): the other lane's roll-up stays skipped, which
  # required checks treat as satisfied, so the owning lane's verdict governs.
  integration-success:
    name: integration-success
    needs: [changes, adk, langchain, n8n, pi, pydantic-ai]
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' &&
         github.event.pull_request.head.repo.full_name != github.repository)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a live suite failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A live integration suite failed or was cancelled."
          exit 1
      - name: All required live suites passed
        run: echo "All live integration suites for touched packages passed (or none were needed)."
