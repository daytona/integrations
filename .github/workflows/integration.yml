# Live integration tests that run against REAL Daytona sandboxes and therefore
# need DAYTONA_API_KEY. These are intentionally kept OUT of ci.yml (per-PR CI).
#
# MERGE GATE: `integration-success` below is a required status check in the
# `protect-main` ruleset. The workflow runs on `pull_request` with no `paths:`
# filter (a required check that never reports would leave PRs stuck at
# "Expected"), which covers humans, dependabot, and GITHUB_TOKEN-authored
# release-please PRs, which fire no other PR event. The `changes` job routes
# which package suites run; suites wait for approval of the `integration-tests`
# environment, so a PR touching a package cannot merge before its live suite was
# approved AND passed.
#
# Fork PRs never receive DAYTONA_API_KEY, so their suites cannot run here, and
# there is deliberately no `pull_request_target` lane running a fork's code with
# it: an approval there binds to whichever run is waiting, not to the commit you
# reviewed. A fork PR that touches a live-tested package keeps the required check
# "Expected"; a maintainer runs its suites by opening a copy of it from a branch
# in this repo (see CONTRIBUTING.md).

name: integration

on:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package(s) to run live tests for'
        type: choice
        default: all
        options:
          - all
          - adk
          - convex
          - langchain
          - n8n
          - pi
          - pydantic-ai
          - agentenv-daytona

permissions:
  contents: read

# Live runs create real sandboxes; don't cancel a run mid-flight (it could orphan
# sandboxes). Serialize per PR instead (ref as the dispatch fallback).
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Decides which package jobs run. No secrets/environment here, so this is safe
  # to run for fork PRs too (it only reads the diff).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      adk: ${{ steps.decide.outputs.adk }}
      convex: ${{ steps.decide.outputs.convex }}
      langchain: ${{ steps.decide.outputs.langchain }}
      n8n: ${{ steps.decide.outputs.n8n }}
      pi: ${{ steps.decide.outputs.pi }}
      pydantic_ai: ${{ steps.decide.outputs.pydantic_ai }}
      agentenv_daytona: ${{ steps.decide.outputs.agentenv_daytona }}
      needs_maintainer_run: ${{ steps.decide.outputs.needs_maintainer_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            adk:
              - 'packages/adk-plugin/**'
            convex:
              - 'packages/convex/**'
            langchain:
              - 'packages/langchain-data-analysis/**'
            n8n:
              - 'packages/n8n-nodes-daytona/**'
            pi:
              - 'packages/pi-extension/**'
            pydantic_ai:
              - 'packages/pydantic-ai-daytona/**'
            agentenv_daytona:
              - 'packages/agentenv-daytona/**'
      - name: Decide which packages run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PKG: ${{ github.event.inputs.package }}
          # Fork = the PR's source branch lives in a different repo than ours.
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          CH_ADK: ${{ steps.filter.outputs.adk }}
          CH_CONVEX: ${{ steps.filter.outputs.convex }}
          CH_LANGCHAIN: ${{ steps.filter.outputs.langchain }}
          CH_N8N: ${{ steps.filter.outputs.n8n }}
          CH_PI: ${{ steps.filter.outputs.pi }}
          CH_PYDANTIC_AI: ${{ steps.filter.outputs.pydantic_ai }}
          CH_AGENTENV_DAYTONA: ${{ steps.filter.outputs.agentenv_daytona }}
        run: |
          set -euo pipefail
          # PRs from branches in this repo run the suites their changes touch. A
          # fork PR never receives DAYTONA_API_KEY, so its suites stay off; if it
          # touches a live-tested package, `needs_maintainer_run` makes
          # integration-success hold the PR for a maintainer run.
          decide() {
            local key="$1" changed="$2"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              if [ "$INPUT_PKG" = "all" ] || [ "$INPUT_PKG" = "$key" ]; then
                echo true
              else
                echo false
              fi
            elif [ "$IS_FORK" != "true" ] && [ "$changed" = "true" ]; then
              echo true
            else
              echo false
            fi
          }
          needs_maintainer_run=false
          if [ "$IS_FORK" = "true" ]; then
            for changed in "${CH_ADK:-false}" "${CH_CONVEX:-false}" "${CH_LANGCHAIN:-false}" \
              "${CH_N8N:-false}" "${CH_PI:-false}" "${CH_PYDANTIC_AI:-false}" \
              "${CH_AGENTENV_DAYTONA:-false}"; do
              if [ "$changed" = "true" ]; then
                needs_maintainer_run=true
              fi
            done
          fi
          {
            echo "adk=$(decide adk "${CH_ADK:-false}")"
            echo "convex=$(decide convex "${CH_CONVEX:-false}")"
            echo "langchain=$(decide langchain "${CH_LANGCHAIN:-false}")"
            echo "n8n=$(decide n8n "${CH_N8N:-false}")"
            echo "pi=$(decide pi "${CH_PI:-false}")"
            echo "pydantic_ai=$(decide pydantic-ai "${CH_PYDANTIC_AI:-false}")"
            echo "agentenv_daytona=$(decide agentenv-daytona "${CH_AGENTENV_DAYTONA:-false}")"
            echo "needs_maintainer_run=$needs_maintainer_run"
          } >> "$GITHUB_OUTPUT"

  adk:
    needs: changes
    if: needs.changes.outputs.adk == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave GITHUB_TOKEN in .git/config where the code under test
          # could read it — the suites never push/pull after checkout.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Pinned to 3.12 for the same reason as ci.yml (obstore wheels).
          python-version: "3.12"
      - name: Install
        working-directory: packages/adk-plugin
        run: python -m pip install -e ".[dev]"
      - name: Integration tests (live Daytona)
        working-directory: packages/adk-plugin
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: pytest

  convex:
    needs: changes
    if: needs.changes.outputs.convex == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Credential hygiene — see the adk job.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
      - name: Install
        working-directory: packages/convex
        run: npm ci
      - name: Build
        working-directory: packages/convex
        run: npm run build
      # Boots an anonymous LOCAL Convex deployment (no Convex account), deploys
      # the example app with the component installed, and drives it end to end
      # against real Daytona sandboxes via `convex run`.
      - name: Live E2E (local Convex deployment + real Daytona)
        working-directory: packages/convex
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: npm run test:live

  langchain:
    needs: changes
    if: needs.changes.outputs.langchain == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave GITHUB_TOKEN in .git/config where the code under test
          # could read it — the suites never push/pull after checkout.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Pinned to 3.12 for the same reason as ci.yml (obstore wheels).
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install
        working-directory: packages/langchain-data-analysis
        run: poetry install --with test,test_integration
      - name: Integration tests (live Daytona)
        working-directory: packages/langchain-data-analysis
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: poetry run pytest tests/integration_tests

  n8n:
    needs: changes
    if: needs.changes.outputs.n8n == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave GITHUB_TOKEN in .git/config where the code under test
          # could read it — the suites never push/pull after checkout.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
      - name: Install
        working-directory: packages/n8n-nodes-daytona
        run: npm ci
      - name: Integration tests (live Daytona)
        working-directory: packages/n8n-nodes-daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          # Optional (add as env secrets/vars if your account needs them):
          # DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
          # DAYTONA_ORGANIZATION_ID: ${{ secrets.DAYTONA_ORGANIZATION_ID }}
          # Optional: widen coverage to ephemeral / create-matrix suites.
          # DAYTONA_TEST_INCLUDE_EPHEMERAL: '1'
          # DAYTONA_TEST_INCLUDE_CREATE_MATRIX: '1'
        run: npm test

  pi:
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave GITHUB_TOKEN in .git/config where the code under test
          # could read it — the suites never push/pull after checkout.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
      - name: Install
        working-directory: packages/pi-extension
        run: npm ci
      - name: Live tests (real Daytona)
        working-directory: packages/pi-extension
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: npm run test:live

  pydantic-ai:
    needs: changes
    if: needs.changes.outputs.pydantic_ai == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Don't leave GITHUB_TOKEN in .git/config where the code under test
          # could read it — the suites never push/pull after checkout.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Pinned to 3.12 for the same reason as ci.yml (obstore wheels).
          python-version: "3.12"
      - name: Install
        working-directory: packages/pydantic-ai-daytona
        run: python -m pip install -e ".[dev]"
      - name: Integration tests (live Daytona)
        working-directory: packages/pydantic-ai-daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: pytest tests/integration_tests

  agentenv-daytona:
    needs: changes
    if: needs.changes.outputs.agentenv_daytona == 'true'
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        working-directory: packages/agentenv-daytona
        run: python -m pip install -e ".[dev]"
      - name: Integration tests (live Daytona)
        working-directory: packages/agentenv-daytona
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: pytest tests/integration_tests -v

  # Single, stable status check to require in branch protection -- the
  # integration counterpart of ci.yml's ci-success. Suites skipped because a PR
  # does not touch their package pass through; a failed, cancelled, or
  # rejected-deployment suite blocks the merge. The job never skips (required
  # checks count a skipped job as passed). On a fork PR that touches a
  # live-tested package it reports under another name instead, so the required
  # check stays "Expected" and the PR can't merge untested; maintainers merge a
  # copy from a branch in this repo (see CONTRIBUTING.md).
  integration-success:
    name: ${{ needs.changes.outputs.needs_maintainer_run == 'true' && 'integration-success (fork PR, needs a maintainer run)' || 'integration-success' }}
    needs: [changes, adk, convex, langchain, n8n, pi, pydantic-ai, agentenv-daytona]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Explain the pending check
        if: needs.changes.outputs.needs_maintainer_run == 'true'
        run: |
          echo "::notice::This fork PR changes a live-tested package. Live tests need DAYTONA_API_KEY, which fork PRs never get, so a maintainer runs them on a copy of this PR from a branch in this repo and merges that copy; this PR's integration-success stays pending (see CONTRIBUTING.md)."
      - name: Fail if a live suite failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A live integration suite failed or was cancelled."
          exit 1
      - name: All required live suites passed
        if: needs.changes.outputs.needs_maintainer_run != 'true'
        run: echo "All live integration suites for touched packages passed (or none were needed)."
